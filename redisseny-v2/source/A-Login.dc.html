<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<title>A · Inici de sessió</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0B7A6C}a:hover{color:#075E53}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; background: #F5F7F7; color: #1A2426; font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 72px 16px 32px">
  <main style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 28px; align-items: stretch">
    <div style="display: flex; justify-content: center">
      <div style="display: flex; align-items: center; font-weight: 800; font-size: 30px; letter-spacing: 0.02em; line-height: 1">
        <span style="background: {{brand}}; color: #FFFFFF; padding: 4px 6px 3px; border-radius: 4px">ESS</span><span style="padding-left: 4px; color: #1A2426">TRAPIS</span>
      </div>
    </div>
    <form style="background: #FFFFFF; border: 1px solid #DFE6E7; border-radius: 12px; padding: 32px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 1px 2px rgba(16,32,30,0.04), 0 8px 24px rgba(16,32,30,0.06)">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 800; line-height: 1.2">Accedeix</h1>
        <p style="margin: 0; color: #56676A">Projectes, temps i diners de la teva entitat.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="a-email" style="font-weight: 700; font-size: 14px">Correu electrònic</label>
        <input id="a-email" type="email" value="persona15@exemple.coop" style="height: 44px; box-sizing: border-box; border: 1px solid #C9D3D4; border-radius: 8px; padding: 0 12px; font: inherit; color: #1A2426; background: #FFFFFF">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <label for="a-pass" style="font-weight: 700; font-size: 14px">Clau de pas</label>
          <a href="#" style="font-size: 14px; font-weight: 600; text-decoration: none">He oblidat la clau</a>
        </div>
        <div style="position: relative; display: flex">
          <input id="a-pass" type="password" value="contrasenya" style="flex: 1; height: 44px; box-sizing: border-box; border: 2px solid {{accent}}; border-radius: 8px; padding: 0 44px 0 11px; font: inherit; color: #1A2426; background: #FFFFFF; outline: 3px solid #CDEDE7">
          <button type="button" aria-label="Mostra la clau" style="position: absolute; right: 2px; top: 2px; width: 40px; height: 40px; border: 0; background: transparent; color: #56676A; cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button type="submit" style="height: 44px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer">Entra</button>
    </form>
    <p style="margin: 0; text-align: center; color: #56676A; font-size: 14px">Problemes per entrar? <a href="#" style="font-weight: 600">Contacta amb l'equip</a></p>
  </main>
  <footer style="width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-top: 48px">
    <span style="font-size: 13px; color: #56676A; font-weight: 600">Amb el suport de</span>
    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px">
      <div style="width: 120px; height: 40px; border: 1px dashed #C9D3D4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #56676A">[Logo 1]</div>
      <div style="width: 120px; height: 40px; border: 1px dashed #C9D3D4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #56676A">[Logo 2]</div>
      <div style="width: 120px; height: 40px; border: 1px dashed #C9D3D4; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #56676A">[Logo 3]</div>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B7A6C","options":["#0B7A6C","#0F766E","#1D6B8F"]},"brand":{"editor":"color","default":"#00B89C"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#0B7A6C', brand: this.props.brand ?? '#00B89C' };
}
}
</script>
</body>
</html>
